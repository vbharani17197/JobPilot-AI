[tool.poetry]
name = "jobpilot-ai"
version = "1.0.0"
description = "Automated job discovery agent: searches job APIs + Naukri, ranks against your resume, tracks history, and generates an Excel report."
authors = ["Bharani Vijayakumar <vbharani@rocketmail.com>"]
readme = "README.md"
packages = [{ include = "jobpilot", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.0"
pdfplumber = "^0.11.0"
openpyxl = "^3.1.5"
pyyaml = "^6.0.2"
loguru = "^0.7.2"
python-dotenv = "^1.0.1"
beautifulsoup4 = "^4.12.3"
lxml = "^5.3.0"
tenacity = "^9.0.0"
anthropic = "^0.40.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"

[tool.poetry.scripts]
jobpilot = "jobpilot.main:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
