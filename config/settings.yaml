# -------------------------------------------------------------
# Search sources. Toggle each on/off. Keys come from environment
# variables (.env) or are filled here (less secure).
# -------------------------------------------------------------
sources:
  adzuna:
    enabled: true
    country: in
    results_per_query: 30
    max_days_old: 30           # Adzuna 'max_days_old' filter
    # Credentials read from env: ADZUNA_APP_ID / ADZUNA_APP_KEY
  jsearch:
    enabled: true             # Set true after adding a RapidAPI key
    country: in
    date_posted: month         # today | 3days | week | month | all
    # Credential read from env: JSEARCH_API_KEY (RapidAPI key)
  naukri:
    enabled: true              # Best-effort bonus source. May yield 0 rows.
    max_pages: 2
    request_delay_seconds: 3   # Be polite; avoid hammering.

# -------------------------------------------------------------
# LLM evaluation (the agentic layer).
# When enabled, Claude reads each job description and reasons about
# fit against your resume: holistic fit score, seniority match,
# matched/missing skills, a one-line rationale, and a shortlist flag.
# Falls back to rule-based scoring if disabled or the API fails.
# -------------------------------------------------------------
llm:
  enabled: true
  model: claude-haiku-4-5      # fast + cheap; ideal for this volume
  max_jobs_per_run: 60         # cap LLM calls for cost control
  batch_size: 15               # jobs per API request
  # How much the LLM's judgement influences the final relevance signal
  # (0.0 = ignore LLM, 1.0 = LLM fully replaces rule-based relevance).
  blend_weight: 0.7
  # Credential read from env: ANTHROPIC_API_KEY

# -------------------------------------------------------------
# Ranking weights (must sum to 100).
# -------------------------------------------------------------
ranking:
  weights:
    skill_match: 40
    experience_match: 20
    ats_compatibility: 15
    job_relevance: 10
    company_assessment: 10
    location_preference: 5
  # Recency preference (days) -> small bonus folded into relevance.
  recency_tiers_days: [1, 3, 7, 14]

# -------------------------------------------------------------
# Output / persistence
# -------------------------------------------------------------
paths:
  history_csv: "data/jobs_history.csv"
  output_dir: "output"
  log_file: "logs/agent.log"

history:
  retention_days: 30

output:
  top_overall: 20
  top_company_site: 20

# URL resolution: how many redirect hops to follow when resolving
# an apply URL to a final ATS/company page.
url_resolution:
  enabled: true
  max_redirects: 5
  timeout_seconds: 10

logging:
  level: INFO                  # DEBUG | INFO | WARNING | ERROR
  rotation: "10 MB"
  retention: "30 days"
